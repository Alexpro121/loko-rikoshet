<title>Герб Локомотива</title>
<style>
  :root { --ink: #05110c; --red: #E31119; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--ink); overflow: hidden; }
  body { display: grid; place-items: center; font-family: system-ui, sans-serif; color: #f6f4ec; -webkit-user-select: none; user-select: none; }
  .stage { position: relative; width: min(64vh, 78vw); aspect-ratio: 166 / 180; }
  .art { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .floor { position: absolute; left: 50%; top: 99%; width: 172.3%; height: 33.4%; transform: translateX(-50%); overflow: visible; pointer-events: none; }
  svg g, svg path, svg circle, svg line, svg ellipse { transform-box: fill-box; }
  /* ці рухаються в координатах самого герба */
  #root, #shake, .pg, #flare, .sk, .sp { transform-box: view-box; transform-origin: 0 0; }
  .pc { transform-box: view-box; transform-origin: 100px 124px; }   /* рама гойдається між переднім і заднім візком */
  .pp { transform-box: view-box; transform-origin: 0 0; }
  .pr { transform-box: view-box; transform-origin: 100px 127px; }   /* кузов погойдується навколо середини колії */
  .pb { transform-box: view-box; transform-origin: 138px 110px; }   /* корпус хитається на ресорах навколо передньої осі */
  .lt, .ky { transform-box: fill-box; transform-origin: center; }
  .again { position: fixed; right: max(18px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom)); padding: 12px 20px; border: 0; border-radius: 0; background: var(--red); color: #fff; font: 800 16px/1 system-ui, sans-serif; letter-spacing: .04em; cursor: pointer; opacity: 0; transition: opacity .4s, transform .12s; }
  .again.on { opacity: 1; }
  .again:active { transform: translateY(2px); }
  .again:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
</style>

<script>
const G = {"VP":[21.3,127],"LAMP":[116.9,78.8],"WHEELS":[48,70,92,124,144],"AX":[0.8929277573019354,-0.45019997805390466],"PX":[0.45019997805390466,0.8929277573019354],"RIBS":[0.95,0.89,0.83,0.77,0.71,0.65,0.6],"MOUTH":[[82.65,71.24],[114.95,127.19]],"STACK":[96,83.4],"NOSE":[[119,76],[130,86],[138,98],[142,110],[149,125]],"LAMPS_Z":[1.053,1.163,1.299,1.449,1.639,1.852,2.1,2.55,3,3.45,3.9,4.35,4.8,5.25,5.7,6.15],"FULL":true,"DIRV":[0.9506192994802042,-0.3103593843526664]};
// Герб ФК «Локомотив» Київ: деталі з офіційного SVG (public/loko-logo.svg), анімація лише WAAPI.
// Локомотив виїжджає з тунелю червоного символу на глядача в перспективі самого логотипу:
// масштаб навколо точки сходу G.VP, тож колеса весь час на лінії колії, а корпус росте вздовж своїх ліній.
const $ = (s) => document.querySelector(s), $$ = (s) => [...document.querySelectorAll(s)];
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage = $('#stage'), again = $('#again'), root = $('#root'), shake = $('#shake'), layers = $$('.px');
let live = [], idle = [], drifting = false;
const A = (el, kf, o) => { const a = el.animate(kf, o); live.push(a); return a; };
const each = (sel, kf, o) => $$(sel).forEach((el) => A(el, kf, o));
const ease = { out: 'cubic-bezier(.16,1,.3,1)', inout: 'cubic-bezier(.65,0,.35,1)' };
const fr = (x) => { const v = Math.sin(x) * 43758.5453; return v - Math.floor(v); };   // сталий «випадок», щоб кожен показ був однаковий

// Текстури диму: клуб із викривленого фрактального шуму з пасмами й прогалинами, світліший згори. Малюються раз при завантаженні.
function smokeTex(kind, seed) {
  const S = 112, cv = document.createElement('canvas'); cv.width = cv.height = S;
  const g = cv.getContext('2d'), im = g.createImageData(S, S), px = im.data;
  const h = (x, y) => fr(x * 127.1 + y * 311.7 + seed * 74.7);
  const sm = (t) => t * t * (3 - 2 * t);
  const vn = (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), u = sm(x - xi), v = sm(y - yi);
    const a = h(xi, yi), b = h(xi + 1, yi), c = h(xi, yi + 1), e = h(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + e) * u * v;
  };
  const fbm = (x, y) => { let s = 0, a = .5, q = 1; for (let o = 0; o < 4; o++) { s += a * vn(x * q, y * q); q *= 2.03; a *= .5; } return s / .9375; };
  const col = { smoke: [[250, 251, 250], [178, 187, 183]], steam: [[255, 255, 255], [190, 201, 196]], lit: [[255, 243, 208], [222, 186, 122]] }[kind];
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const X = x / S, Y = y / S, r = Math.hypot(X - .5, Y - .5) * 2;
    const wx = fbm(X * 3 + seed, Y * 3 + 7.3), wy = fbm(X * 3 + 3.1, Y * 3 + seed * 1.7);
    const n = fbm(X * 4.2 + wx * 1.7 + seed * 5, Y * 4.2 + wy * 1.7);
    const fall = Math.max(0, 1 - r), dens = Math.pow(fall, 1.3) * (n * 1.75 - .38);
    const t = Math.min(1, Math.max(0, Y * .85 + (.5 - n) * .7)), i = (y * S + x) * 4;
    for (let c = 0; c < 3; c++) px[i + c] = col[0][c] + (col[1][c] - col[0][c]) * t;
    px[i + 3] = Math.pow(Math.max(0, Math.min(1, dens * 1.35)), 1.15) * 255;
  }
  g.putImageData(im, 0, 0);
  return cv.toDataURL();
}
if (!calm) {
  const tex = { smoke: [1, 2, 3].map((s) => smokeTex('smoke', s)), steam: [4, 5, 6].map((s) => smokeTex('steam', s)), lit: [7, 8].map((s) => smokeTex('lit', s)) };
  $$('.sp').forEach((im, i) => { const l = tex[im.dataset.k]; im.setAttribute('href', l[i % l.length]); });
}

// рух локомотива: відстань до глядача z, видимий розмір 1/z
const VP = G.VP;
const LT = G.FULL ? 700 : 1500, D = 2700, ARR = LT + D;         // старт, час виїзду, мить зупинки (у тестовій версії герб уже повний, тож рушає раніше)
const C = .74, Z0 = 7;                                           // рівний хід майже до виходу, далі різке гальмування; на старті він усемеро далі
const SET = 1100;                                                // скільки після зупинки ще заспокоюється підвіска
const V = 1 / (C + (1 - C) / 2);
const dist = (u) => u < C ? V * u : V * u - V * (u - C) * (u - C) / (2 * (1 - C));   // пройдена частка шляху
const zAt = (u) => Z0 - (Z0 - 1) * dist(u);
const sAt = (u) => 1 / zAt(u);
const spd = (u) => u < C ? 1 : Math.max(0, 1 - (u - C) / (1 - C));
const tr = (x, y) => 'translate(' + x.toFixed(3) + 'px,' + y.toFixed(3) + 'px)';
const persp = (s) => tr(VP[0] * (1 - s), VP[1] * (1 - s)) + ' scale(' + s.toFixed(4) + ')';
const world = (p, s) => [VP[0] + s * (p[0] - VP[0]), VP[1] + s * (p[1] - VP[1])];
const uWhen = (ok) => { let u = 0; while (u < 1 && !ok(u)) u += .002; return u; };
const glow = (u) => Math.min(1, .3 + 1.9 * Math.max(0, sAt(u) - .14));   // скільки світла фари в тунелі: що ближче, то яскравіше
const joints = [];                                                // стики рейок: через рівні відрізки шляху
for (let i = 1, zb = Z0; i <= 1600; i++) { const u = i / 1600, z = zAt(u); if (zb - z >= .3) { zb = z; joints.push(u); } }

/** Підвіска. Передній і задній візки ловлять кожен стик по черзі, рама гойдається між ними; кузов на ресорах іде за рамою
 *  з запізненням, клює носом, поки тримають гальма, і відскакує, коли потяг став; на ходу кузов погойдується з боку на бік.
 *  Повертає стан кожні 4 мс: [час, підскок рами, нахил рами°, плуг відносно рами, кузов відносно рами, кивок кузова°, крен°]. */
function suspension() {
  const dt = 4, n = Math.round((D + SET) / dt), w = (hz) => 2 * Math.PI * hz / 1000;
  const wB = w(15), wH = w(3.3), wP = w(2.1), wR = w(1.2);
  const J = joints.map((u) => u * D), hits = [];
  J.forEach((t, k) => { const gap = (k < J.length - 1 ? J[k + 1] : t + (t - J[k - 1])) - t, a = spd(t / D); hits.push([t, 0, a], [t + gap * .42, 1, a]); });
  hits.sort((p, q) => p[0] - q[0]);
  let cf = 0, vf = 0, cr = 0, vr = 0, yb = 0, vb = 0, th = 0, vt = 0, ro = 0, vro = 0, bk = 0, hi = 0;
  const out = [];
  for (let i = 0; i <= n; i++) {
    const t = i * dt, u = Math.min(1, t / D);
    while (hi < hits.length && hits[hi][0] <= t) {
      const [, rear, a] = hits[hi++];
      if (rear) vr -= .085 * a; else vf -= .085 * a;
      vb -= .012 * a; vro += (fr(hi * 2.71) - .5) * .0001 * a;
    }
    bk += ((t >= D * C && t < D ? 1 : 0) - bk) * Math.min(1, dt / 110);   // гальма набирають силу й відпускають за ~0,1 с
    vf += (-wB * wB * cf - 2 * .42 * wB * vf) * dt; cf += vf * dt;
    vr += (-wB * wB * cr - 2 * .42 * wB * vr) * dt; cr += vr * dt;
    const yc = (cf + cr) / 2, vc = (vf + vr) / 2;
    vb += (-wH * wH * (yb - yc) - 2 * .26 * wH * (vb - vc)) * dt; yb += vb * dt;
    vt += (-wP * wP * (th - 1.6 * bk) - 2 * .24 * wP * vt) * dt; th += vt * dt;
    vro += (-wR * wR * ro - 2 * .25 * wR * vro + wR * wR * .0025 * spd(u) * Math.sin(2 * Math.PI * t / 760)) * dt; ro += vro * dt;
    out.push([t, yc, (cr - cf) / 88 * 57.3, cf - yc, yb - yc, th, ro * 57.3]);
  }
  return out;
}

/** Клуб диму чи пари: виринає, розпливається й тане; рух гальмує, як у справжнього диму. */
const puff = (el, x, y, dx, dy, s0, s1, r0, dr, op, dur, at) => A(el, [
  { opacity: 0, transform: tr(x, y) + ' rotate(' + r0 + 'deg) scale(' + s0.toFixed(3) + ')', easing: 'cubic-bezier(.1,.55,.3,1)' },
  { opacity: op, offset: .14, easing: 'ease-in-out' },
  { opacity: op * .55, offset: .5, easing: 'ease-in-out' },
  { opacity: 0, transform: tr(x + dx, y + dy) + ' rotate(' + (r0 + dr) + 'deg) scale(' + s1.toFixed(3) + ')' }], { duration: dur, delay: at, fill: 'backwards' });

function reset() {
  for (const a of [...live, ...idle]) a.cancel();
  live = []; idle = []; drifting = false;
  tx = ty = cx = cy = 0;
  for (const g of layers) g.removeAttribute('transform');
  again.classList.remove('on');
}

function play() {
  reset();
  const line = $('#railsLine'), L = line.getTotalLength();
  if (calm) {                                                     // без руху: лише готовий герб
    $('#railsFill').setAttribute('opacity', 1); line.style.opacity = 0;
    for (const el of $$('.lt, .ky')) el.setAttribute('opacity', 1);
    $('#refl').setAttribute('opacity', '.14');
    again.classList.add('on');
    return;
  }
  if (G.FULL) {                                                   // тестова версія: герб, напис і темний зів тунелю вже на місці
    $('#railsFill').setAttribute('opacity', 1); line.style.opacity = 0;
    for (const el of $$('.lt, .ky')) el.setAttribute('opacity', 1);
    $('#refl').setAttribute('opacity', '.14');
  } else {
    // 1. камера вилітає назад із рейок, рейки малюються лінією
    A($('#railsG'), [{ transform: 'scale(4.2) rotate(-8deg)', opacity: 0 }, { opacity: 1, offset: .15 }, { transform: 'none', opacity: 1 }], { duration: 1300, delay: 150, easing: ease.out, fill: 'both' });
    A(line, [{ strokeDasharray: L + ' ' + L, strokeDashoffset: L }, { strokeDasharray: L + ' ' + L, strokeDashoffset: 0 }], { duration: 1100, delay: 200, easing: ease.inout, fill: 'both' });
    A($('#railsFill'), [{ opacity: 0 }, { opacity: 1 }], { duration: 320, delay: 1120, easing: 'ease-out', fill: 'both' });
    A(line, [{ opacity: 1 }, { opacity: 0 }], { duration: 300, delay: 1350, fill: 'forwards' });
    // 2. плита розкривається позаду від вершини рейок
    $('#plate').style.transformOrigin = '50% 32%';
    A($('#plate'), [{ transform: 'scale(.15)', opacity: 0 }, { transform: 'scale(1.04)', opacity: 1, offset: .7 }, { transform: 'none', opacity: 1 }], { duration: 640, delay: 950, easing: ease.out, fill: 'both' });
  }

  const run = { duration: D, delay: LT, easing: 'linear', fill: 'both' };
  const sample = (n, fn) => Array.from({ length: n + 1 }, (_, i) => fn(i / n));
  // 3. зів тунелю темніє під червоним «Λ»; у глибині ледь видно кільця обробки
  // тунель розчиняється: щойно потяг став, денне світло заходить у зів, і темрява відступає в глибину рваним димчастим краєм;
  // лампи перед краєм блимають і гаснуть одна за одною, а там, де темрява відступила, лишається легкий туман, що тане
  const DV0 = ARR + 140, DVD = 1700, FA = 132, FB = 4, DE = [.42, 0, .3, 1];
  const ang = Math.atan2(G.DIRV[1], G.DIRV[0]) * 180 / Math.PI;
  const front = (F) => 'translate(' + VP[0] + 'px,' + VP[1] + 'px) rotate(' + ang.toFixed(2) + 'deg) translate(' + F + 'px,0px)';
  const atFront = (q) => DV0 + DVD * timeAt(DE, Math.max(0, Math.min(1, (FA - q) / (FA - FB))));   // коли край доходить до відстані q від точки сходу
  A($('#disF'), [{ transform: front(FA) }, { transform: front(FB) }], { duration: DVD, delay: DV0, easing: 'cubic-bezier(' + DE + ')', fill: 'both' });
  const TD = DV0 + DVD + 150;
  A($('#tdark'), G.FULL ? [{ opacity: 1 }, { opacity: 1, offset: (DV0 + DVD - 100) / TD }, { opacity: 0 }]
    : [{ opacity: 0 }, { opacity: 0, offset: 1150 / TD }, { opacity: 1, offset: 1720 / TD, easing: ease.inout }, { opacity: 1, offset: (DV0 + DVD - 100) / TD }, { opacity: 0 }], { duration: TD, fill: 'both' });
  $$('.wl').forEach((el) => {
    const o = +el.getAttribute('opacity');
    A(el, [{ opacity: o }, { opacity: o * .3, offset: .2 }, { opacity: o * .85, offset: .34 }, { opacity: o * .12, offset: .55 }, { opacity: o * .45, offset: .66 }, { opacity: 0 }], { duration: 340, delay: atFront(+el.dataset.p + 40) - 120, fill: 'forwards' });
  });
  $$('.ms').forEach((el, j) => {
    const q = (j + .5) / 9 * .92, F = FA - (FA - FB) * q, r = fr(j * 6.7 + 31), off = -30 + (j % 5) * 12 + r * 6, a = G.DIRV;
    const x = VP[0] + a[0] * (F - 16) - a[1] * off, y = VP[1] + a[1] * (F - 16) + a[0] * off, far = 8 + 8 * r;
    puff(el, x, y, a[0] * far, a[1] * far - 5 - 4 * r, .9, 1.9 + .8 * r, (r * 360) | 0, ((r - .5) * 60) | 0, .32, 1500 + 600 * r, DV0 + DVD * timeAt(DE, q));
  });
  // світло фари в тунелі: пляма на стінах, конус у димці, відблиск на рейці; кільця спалахують, коли світло підходить до них
  A($('#beamT'), sample(90, (u) => ({ offset: u, opacity: +glow(u).toFixed(3) })), run);
  A($('#apg'), sample(90, (u) => { const s = sAt(u); return { offset: u, opacity: +(glow(u) * (s < .42 ? 1 : Math.max(.35, 1 - (s - .42) * 2.5))).toFixed(3) }; }), run);
  A($('#glint'), sample(90, (u) => ({ offset: u, opacity: +(.85 * glow(u) * (sAt(u) < .8 ? 1 : 0)).toFixed(3) })), run);
  $$('.rb').forEach((el, j) => {
    const zr = 1 / G.RIBS[j];
    A(el, sample(90, (u) => { const d = zAt(u) - zr, b = d < -.04 ? 0 : Math.exp(-((d - .3) ** 2) / .1); return { offset: u, opacity: +(.12 + .88 * b * glow(u)).toFixed(3) }; }), run);
  });
  $$('.lh').forEach((el, j) => {
    const r = fr(j * 8.3 + 5), d = 24 + j * 20, o = (r - .5) * 18, k0 = 1.4 + j * .35, a0 = (r * 360) | 0;
    const x = G.LAMP[0] + G.AX[0] * d + G.PX[0] * o, y = G.LAMP[1] + G.AX[1] * d + G.PX[1] * o;
    A(el, [{ opacity: 0, transform: tr(x, y) + ' rotate(' + a0 + 'deg) scale(' + k0 + ')' }, { opacity: .35, offset: .08 }, { opacity: .35, offset: .9 }, { opacity: 0, transform: tr(x + 4, y - 3) + ' rotate(' + (a0 + 40) + 'deg) scale(' + (k0 * 1.3).toFixed(2) + ')' }], { duration: D + 300, delay: LT - 300, fill: 'both' });
  });

  // 4. виїзд: перспектива спільна для всіх копій локомотива (сам, його вогні, промінь фари)
  each('.pg', sample(120, (u) => ({ offset: u, transform: persp(sAt(u)) })), run);
  // кожна деталь реагує на рух по-своєму: рама й плуг на візках, кузов на ресорах, крен
  const SU = suspension(), TS = D + SET, ride = { duration: TS, delay: LT, easing: 'linear', fill: 'both' };
  const keys = (fn) => { const k = []; for (let i = 0; i < SU.length; i += 3) k.push({ offset: Math.min(1, SU[i][0] / TS), transform: fn(SU[i]) }); k.push({ offset: 1, transform: fn([TS, 0, 0, 0, 0, 0, 0]) }); return k; };
  each('.pc', keys((q) => 'translateY(' + q[1].toFixed(3) + 'px) rotate(' + q[2].toFixed(3) + 'deg)'), ride);
  each('.pp', keys((q) => 'translateY(' + q[3].toFixed(3) + 'px)'), ride);
  each('.pr', keys((q) => 'rotate(' + q[6].toFixed(3) + 'deg)'), ride);
  each('.pb', keys((q) => 'translateY(' + q[4].toFixed(3) + 'px) rotate(' + q[5].toFixed(3) + 'deg)'), ride);
  // вогні: фара, габарити й світло в кабіні; кабіна гасне, коли він виходить на день
  const uX = uWhen((u) => sAt(u) >= .8);
  // фара: у тунелі сліпить, на денному світлі здається слабшою, а коли потяг став, гасне, як лампа розжарення:
  // спершу швидко, далі довгим хвостом, і біле світло наостанок тепліє до бурштинового
  const uL = uWhen((u) => sAt(u) >= .76), OFF = ARR + 260, FADE = 1500, TL = OFF + FADE - LT;
  const lamp = (o) => [{ opacity: 0 }, { opacity: o, offset: .02 * D / TL }, { opacity: o, offset: D * uL / TL }, { opacity: o * .62, offset: (D * uL + 280) / TL }, { opacity: o * .62, offset: (OFF - LT) / TL, easing: 'cubic-bezier(.2,.6,.35,1)' }, { opacity: 0 }];
  const lit = { duration: TL, delay: LT, fill: 'both' };
  A($('#lampRun'), lamp(1), lit);
  each('.mk', lamp(.95), lit);
  A($('#amber'), [{ opacity: 0 }, { opacity: 0, offset: .08 }, { opacity: 1, offset: .5 }, { opacity: 0 }], { duration: FADE + 150, delay: OFF, easing: 'ease-in-out', fill: 'both' });
  // промінь назовні з'являється, щойно фара вийшла на волю, і гасне разом із нею
  A($('#beamP'), [{ opacity: 0 }, { opacity: 0, offset: D * uL / TL }, { opacity: .5, offset: (D * uL + 320) / TL }, { opacity: .5, offset: (OFF - LT) / TL, easing: 'cubic-bezier(.2,.6,.35,1)' }, { opacity: 0 }], lit);
  // тунельні лампи: щоразу, коли локомотив минає лампу, по ньому від морди до хвоста пробігає теплий відблиск
  $$('.sw').forEach((el, j) => {
    const zr = G.LAMPS_Z[j], u0 = uWhen((u) => zAt(u) <= zr), u1 = uWhen((u) => zAt(u) <= zr - .3);
    if (u0 >= 1 || sAt(u0) < .17 || sAt(u0) > .84) return;
    A(el, [{ opacity: 0, transform: 'translateX(158px)' }, { opacity: .55, offset: .2 }, { opacity: .55, offset: .7 }, { opacity: 0, transform: 'translateX(56px)' }], { duration: Math.min(420, Math.max(110, D * (u1 - u0))), delay: LT + D * u0, easing: 'linear', fill: 'backwards' });
  });
  each('.cab', [{ opacity: 0 }, { opacity: .85, offset: .03 }, { opacity: .85, offset: uX }, { opacity: 0 }], run);
  // спалах фари назустріч глядачеві: в темряві тунелю він видніший за сам локомотив
  const fk = sample(120, (u) => { const s = sAt(u), p = world(G.LAMP, s); return { offset: u, transform: tr(p[0], p[1]) + ' scale(' + (.3 + .7 * Math.sqrt(s)).toFixed(3) + ')' }; });
  A($('#flare'), fk, run);
  A($('#flare'), lamp(1), lit);
  // гуркіт: що ближче важкий локомотив, то сильніше дрижить картинка
  const rn = Math.round(D / 42);
  A(shake, sample(rn, (u) => { const i = Math.round(u * rn), a = u < .2 || i === rn ? 0 : .55 * Math.pow(sAt(u), 1.5) * (1 - .7 * (1 - spd(u))); return { offset: u, transform: tr((fr(i * 1.7) - .5) * 2 * a, (fr(i * 3.1) - .5) * 2 * a) }; }), { duration: D, delay: LT, easing: 'linear' });
  // іскри з-під коліс на гальмуванні: вилітають там, де колесо було тієї миті, і летять назад до тунелю
  $$('.sk').forEach((k, i) => {
    const u = C + .02 + (i / 26) * (.97 - C - .02), s = sAt(u), r = fr(i * 5.1);
    const x0 = VP[0] + s * (G.WHEELS[i % 5] - VP[0]), y0 = 127, fly = (5 + r * 9) * s + 1.5, k0 = (.4 + s).toFixed(2);
    A(k, [
      { opacity: 1, transform: tr(x0, y0) + ' scale(' + k0 + ')' },
      { opacity: 1, transform: tr(x0 - fly * .7, y0 - (1.5 + r * 3) * s) + ' scale(' + k0 + ')', offset: .45 },
      { opacity: 0, transform: tr(x0 - fly, y0 + 1.5) + ' scale(' + k0 + ')' }], { duration: 220 + r * 180, delay: LT + D * u, easing: 'ease-out', fill: 'forwards' });
  });

  // 5. дим, і в кожного свій видимий початок.
  // Вихлоп: клуби б'ють із комина на даху, щойно той підходить до виходу; потяг гальмує, і дим не встигає за ним,
  // а вітер зносить його вгору-вправо, з герба на темне тло. Що ближче зупинка, то рідше й слабше: дизель скидає оберти
  const ex = $$('.ex'), e0 = LT + D * uWhen((u) => sAt(u) >= .74), e1 = ARR + 900;
  ex.forEach((el, j) => {
    const at = e0 + (e1 - e0) * Math.pow(j / (ex.length - 1), 1.35), u = Math.min(1, (at - LT) / D), s = sAt(u), p = world(G.STACK, s), r = fr(j * 3.3 + 11), q = fr(j * 7.1 + 13);
    const f = at < ARR ? 1 : Math.max(.45, 1 - (at - ARR) / 1600);
    puff(el, p[0] + (q - .5) * 1.5, p[1], 6 + 11 * r, -(15 + 13 * q), .28 + .1 * q, (1.2 + .9 * r) * f, (r * 360) | 0, ((q - .5) * 110) | 0, (.42 + .12 * q) * f, 2000 + 900 * r, at);
  });
  // носова хвиля: дим тунелю зривається з морди, щойно та проходить зів, і розкочується навсібіч
  const bw = $$('.bw'), n0 = uWhen((u) => sAt(u) >= .6), n1 = uWhen((u) => sAt(u) >= .92);
  bw.forEach((el, j) => {
    const u = n0 + (n1 - n0) * j / (bw.length - 1), s = sAt(u), pt = G.NOSE[j % G.NOSE.length], p = world(pt, s), r = fr(j * 4.7 + 21), q = fr(j * 1.3 + 23);
    const rx = p[0] - VP[0], ry = p[1] - VP[1], rl = Math.hypot(rx, ry), up = pt[1] < 100 ? -.75 : pt[1] < 120 ? -.3 : 0;
    const far = (9 + 13 * r) * s * 1.4;
    puff(el, p[0], p[1], rx / rl * far, (ry / rl + up) * far - 3 * q, .3 * s + .1, (1.3 + .9 * r) * s, (q * 360) | 0, ((r - .5) * 100) | 0, .34 + .12 * q, 1300 + 700 * r, LT + D * u);
  });
  // пара з гальм: б'є з-під передніх коліс, коли ті вже на світлі, густішає до зупинки й тягнеться вздовж колії;
  // на зупинці ще раз шипить з-під задніх
  const sb = $$('.sb'), b0 = LT + D * uWhen((u) => sAt(u) >= .8), b1 = ARR + 420, nb = sb.length - 4;
  sb.forEach((el, j) => {
    const r = fr(j * 6.1 + 4), q = fr(j * 2.3 + 8);
    if (j >= nb) {
      const x = j % 2 ? 70 : 92;
      puff(el, x + (q - .5) * 4, 125.6, (j % 2 ? -1 : 1) * (6 + r * 10), -(2 + q * 5), .4, 1.1 + r * .8, (r * 360) | 0, ((q - .5) * 60) | 0, .5, 1800 + r * 900, ARR + 240 + (j - nb) * 70);
      return;
    }
    const at = b0 + (b1 - b0) * Math.pow(j / (nb - 1), .7), s = sAt(Math.min(1, (at - LT) / D)), side = j % 4 === 0 ? -1 : 1;
    const x = VP[0] + s * ((j % 2 ? 124 : 144) - VP[0]) + (q - .5) * 4;
    puff(el, x, 125.4, side * (6 + r * 16), -(2.5 + q * 7), .45 + .15 * q, 1.2 + r * 1.1, (r * 360) | 0, (side * (20 + q * 40)) | 0, .5 + .2 * q, 1900 + r * 1100, at);
  });

  // тестова версія: щойно ніс заходить на праву ногу, її продовження за локомотивом розчиняється, і до зупинки лишаються зрізи, як у гербі
  if (G.FULL) { const x0 = LT + D * uWhen((u) => sAt(u) >= .62); A($('#railExt'), [{ opacity: 1 }, { opacity: 0 }], { duration: ARR + 250 - x0, delay: x0, easing: 'cubic-bezier(.4,0,.6,1)', fill: 'forwards' }); }
  // 6. зупинка: герб здригається
  A(root, [{ transform: 'none' }, { transform: tr(.9, .5) }, { transform: tr(-.35, 0) }, { transform: 'none' }], { duration: 380, delay: ARR - 20, easing: 'ease-out' });
  // 7. LOKOMOTYV: під написом мчить червона рейка, і літери виростають із неї там, де вона щойно пройшла
  let S = ARR + 1300;
  if (!G.FULL) {
  const rail = $('#rail'), RL = rail.getTotalLength(), R0 = ARR + 120, RD = 640, RE = [.7, 0, .2, 1];
  A(rail, [{ opacity: 1, strokeDasharray: RL + ' ' + RL, strokeDashoffset: RL }, { opacity: 1, strokeDasharray: RL + ' ' + RL, strokeDashoffset: 0 }], { duration: RD, delay: R0, easing: 'cubic-bezier(' + RE + ')', fill: 'both' });
  let lastUp = 0;
  $$('.lt').forEach((el) => {
    const b = el.getBBox(), at = R0 + RD * timeAt(RE, (b.x + b.width * .5 - 29.6) / 110.2);
    A(el, [{ opacity: 1, transform: 'translateY(15px)' }, { opacity: 1, transform: 'none' }], { duration: 560, delay: at, easing: 'cubic-bezier(.2,.85,.25,1)', fill: 'both' });
    lastUp = Math.max(lastUp, at);
  });
  // рейка йде далі, як останній вагон: стирається зліва направо й зникає
  A(rail, [{ opacity: 1, strokeDasharray: RL + ' ' + RL, strokeDashoffset: 0 }, { opacity: 1, strokeDasharray: RL + ' ' + RL, strokeDashoffset: -RL }], { duration: 520, delay: lastUp + 160, easing: 'cubic-bezier(.6,0,.8,.4)', fill: 'forwards' });
  A(rail, [{ opacity: 1 }, { opacity: 0 }], { duration: 1, delay: lastUp + 690, fill: 'forwards' });
  // 8. KYIV: літери видихають із центру й розходяться на свої місця
  const K = ARR + 760, kb = $$('.ky').map((el) => el.getBBox()), kc = (kb[0].x + kb[3].x + kb[3].width) / 2;
  $$('.ky').forEach((el, i) => A(el, [{ opacity: 0, transform: 'translateX(' + (kc - kb[i].x - kb[i].width / 2).toFixed(2) + 'px)' }, { opacity: 1, offset: .35 }, { opacity: 1, transform: 'none' }], { duration: 950, delay: K, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'both' }));
  // 9. відблиск по всьому гербу, відображення на підлозі
  S = Math.max(lastUp + 900, K + 950);
  A($('#refl'), [{ opacity: 0 }, { opacity: .14 }], { duration: 900, delay: ARR - 200, fill: 'both' });
  }
  A($('#sheen'), [{ transform: 'skewX(-22deg) translateX(0)' }, { transform: 'skewX(-22deg) translateX(250px)' }], { duration: 1000, delay: S, easing: ease.inout, fill: 'both' });
  Promise.all(live.map((a) => a.finished)).then(startIdle, () => {});   // кнопка й життя герба лише після всього входу
}

/** Після входу герб живе: кузов ледь дихає на ресорах, дизель тихо курить із даху, відблиск пробігає знову. */
function startIdle() {
  again.classList.add('on');
  drifting = true;
  const I = (el, kf, o) => { const a = el.animate(kf, o); idle.push(a); return a; };
  $$('.pb').forEach((b) => I(b, [{ transform: 'none' }, { transform: 'translate(.15px,-.3px)' }, { transform: 'none' }], { duration: 1800, iterations: Infinity, easing: 'ease-in-out' }));
  I($('#sheen'), [{ transform: 'skewX(-22deg) translateX(0)' }, { transform: 'skewX(-22deg) translateX(0)', offset: .7 }, { transform: 'skewX(-22deg) translateX(250px)' }], { duration: 6000, iterations: Infinity, easing: ease.inout });
  $$('.wp').forEach((w, i) => {
    const [x, y] = G.STACK, a0 = (fr(i * 4.4) * 360) | 0, end = tr(x - 4 - i * 2, y - 13) + ' rotate(' + (a0 + 50) + 'deg) scale(1)';
    I(w, [{ opacity: 0, transform: tr(x, y) + ' rotate(' + a0 + 'deg) scale(.2)', easing: 'cubic-bezier(.1,.55,.3,1)' }, { opacity: .26, offset: .14, easing: 'ease-in-out' }, { opacity: 0, transform: end, offset: .7 }, { opacity: 0, transform: end }],
      { duration: 3600, delay: 300 + i * 1200, iterations: Infinity });
  });
}

// Паралакс за курсором чи пальцем: шари герба зсуваються всередині SVG, тож усе лишається векторним і різким
let tx = 0, ty = 0, cx = 0, cy = 0, raf = 0;
function drift() {
  cx += (tx - cx) * .08; cy += (ty - cy) * .08;
  for (const g of layers) { const d = +g.dataset.d; g.setAttribute('transform', 'translate(' + (cx * d).toFixed(3) + ' ' + (cy * d).toFixed(3) + ')'); }
  raf = Math.abs(tx - cx) + Math.abs(ty - cy) > .001 ? requestAnimationFrame(drift) : 0;
}
addEventListener('pointermove', (e) => {
  if (calm || !drifting) return;
  const r = stage.getBoundingClientRect();
  tx = Math.max(-1, Math.min(1, (e.clientX - (r.left + r.width / 2)) / (r.width * .8)));
  ty = Math.max(-1, Math.min(1, (e.clientY - (r.top + r.height / 2)) / (r.height * .8)));
  if (!raf) raf = requestAnimationFrame(drift);
});
addEventListener('pointerleave', () => { tx = ty = 0; if (drifting && !raf) raf = requestAnimationFrame(drift); });
again.addEventListener('click', play);
document.addEventListener('visibilitychange', () => { for (const a of [...live, ...idle]) document.hidden ? a.pause() : a.play(); });
/** Частка часу, коли крива cubic-bezier(e) доходить до частки шляху p. */
function timeAt(e, p) {
  p = Math.max(0, Math.min(1, p));
  for (let i = 1; i <= 400; i++) {
    const t = i / 400, m = 1 - t, y = 3 * m * m * t * e[1] + 3 * m * t * t * e[3] + t * t * t;
    if (y >= p) return 3 * m * m * t * e[0] + 3 * m * t * t * e[2] + t * t * t;
  }
  return 1;
}
play();
</script>
