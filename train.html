<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b3d2a" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <title>LOKO · Пак-потяг</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b3d2a; color: #fff; font-family: Rubik, system-ui, sans-serif; }
    #tr { max-width: 760px; margin: 0 auto; padding: 18px; }
    #tr h1 { margin: 0 0 12px; font-weight: 800; }
    #tr p { margin: 10px 0; line-height: 2.2; }
    #tr button { margin: 0 6px 6px 0; padding: 8px 14px; border: 2px solid #fff; border-radius: 10px; background: transparent; color: #fff; font: 600 15px Rubik, system-ui, sans-serif; cursor: pointer; }
    #tr button.on { background: #fff; color: #0b3d2a; }
    #tr button.go { padding: 12px 26px; background: #e31119; border-color: #e31119; font-weight: 800; font-size: 18px; }
    #tr .fine { opacity: .7; font-size: 14px; line-height: 1.4; }
    #tr pre { font-size: 13px; opacity: .85; white-space: pre-wrap; }
    .tr-card { position: fixed; z-index: 40; box-sizing: border-box; border: 4px solid; border-radius: 12px; pointer-events: none; }
  </style>
</head>
<body>
  <div id="tr"></div>
  <script type="module" src="/src/lab/train.js"></script>
</body>
</html>
