<style>
[hidden]{display:none!important}
:root{--h:var(--tg-theme-hint-color);--s:var(--tg-theme-secondary-bg-color);--a:var(--tg-theme-button-color);--at:var(--tg-theme-button-text-color)}
body{margin:0;padding:0 0 max(12px,env(safe-area-inset-bottom));font:15px/1.3 system-ui,sans-serif;font-variant-numeric:tabular-nums}
.hd{display:flex;gap:12px;align-items:center;padding:14px;background:#0b3d2a;color:#fff}
.hd svg{flex:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}
.nm{flex:1;min-width:0}
.nm b{display:block;font-size:20px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm span{font-size:13px;color:rgba(255,255,255,.75)}
.rk{flex:none;padding:4px 9px;border-radius:99px;background:rgba(0,0,0,.25);font:700 13px system-ui,sans-serif}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 12px 4px}
.t{padding:9px 6px;border-radius:12px;background:var(--s);text-align:center}
.t b{display:block;font-size:19px}
.t span{font-size:12px;color:var(--h)}
.t i{font-style:normal;color:var(--h);font-weight:400}
h4{margin:10px 14px 4px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--h)}
.r{display:flex;align-items:center;gap:10px;padding:5px 14px}
.r u{flex:none;width:10px;height:10px;border-radius:50%}
.r span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r small{font-size:12px;color:var(--h)}
.r b{font-size:17px}
.bt{display:flex;gap:8px;padding:10px 12px 0}
button{flex:1;height:42px;border:0;border-radius:12px;background:var(--a);color:var(--at);font:600 15px system-ui,sans-serif}
#up{flex:none;width:42px;background:var(--s);color:var(--tg-theme-text-color)}
#up.sp{animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.no{padding:6px 14px;color:var(--h);font-size:14px}
</style>
<div class="hd" id="hd"><svg width="44" height="52" viewBox="0 0 40 48"><path id="s0" d="M20 2 38 8v14c0 12-8 20-18 24C10 42 2 34 2 22V8z" fill="#254e9c" stroke="#e8b923" stroke-width="2.5"/><path id="s1" d="M15 4.6h10v39.2l-5 2.2-5-2.2z" fill="#e4e8ec"/><path id="ic" d="M20 15.5l2.1 4.3 4.7.7-3.4 3.3.8 4.7-4.2-2.2-4.2 2.2.8-4.7-3.4-3.3 4.7-.7z" fill="#e8b923" stroke="rgba(0,0,0,.35)" stroke-width=".8"/></svg><div class="nm"><b id="n">LOKO RUSH</b><span id="ci"></span></div><div class="rk" id="rk"></div></div>
<div id="box"></div>
<div class="bt"><button id="go">▶ Грати</button><button id="up">↻</button></div>
<script>
const T=window.TelegramWidget,$=i=>document.getElementById(i),J=(s,d)=>{try{return s?JSON.parse(s):d}catch(e){return d}},
RC={c:'#9ca3af',r:'#5fb3e6',e:'#b06ae0',l:'#e8b923'},E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
let D=null,busy=0;
const own=T&&!T.isForward&&!T.isPreview&&T.chatType=='private';
function draw(d){if(!d||typeof d!='object')return;D=d;const c=Array.isArray(d.c)?d.c:[];
 $('hd').style.background='linear-gradient(135deg,'+(c[0]||'#0b3d2a')+',#0b3d2a)';
 $('s0').setAttribute('fill',c[0]||'#555');$('s1').setAttribute('fill',c[1]||'#999');$('s0').setAttribute('stroke',c[2]||'#ccc');
 $('ic').setAttribute('fill',c[2]||'#fff');
 $('n').textContent=d.n||'Клубу ще немає';$('ci').textContent=d.n?(d.ci||'')+' · Рівень '+(d.l|0):d.p||'';
 $('rk').textContent=d.k?'#'+d.k:'';$('rk').hidden=!d.k;
 if(!d.n){$('box').innerHTML='<p class="no">Відкрий онлайн-режим у грі: клуб з’явиться тут, з рейтингом, монетами й зірками складу.</p>';return}
 const rc=Array.isArray(d.rec)?d.rec:[0,0,0],h=Array.isArray(d.h)?d.h:[];
 $('box').innerHTML='<div class="g"><div class="t"><b>'+(d.r|0)+'</b><span>Рейтинг</span></div><div class="t"><b>'+(d.co|0)+'</b><span>Монети</span></div><div class="t"><b>'+(rc[0]|0)+'<i>-</i>'+(rc[1]|0)+'<i>-</i>'+(rc[2]|0)+'</b><span>В-Н-П</span></div></div>'
 +(h.length?'<h4>Зірки складу</h4>'+h.slice(0,3).map(x=>'<div class="r"><u style="background:'+(RC[x[1]]||RC.c)+'"></u><span>'+E(x[0])+' <small>'+E(x[3]||'')+'</small></span><b>'+(x[2]|0)+'</b></div>').join(''):'')}
function ask(){if(busy||!own)return;busy=1;$('up').className='sp';
 T.request('me').then(a=>draw(J(a.result,null)),()=>0).finally(()=>{busy=0;$('up').className=''})}
$('go').onclick=()=>{const b=D&&D.b;if(T&&b)T.openTelegramLink('https://t.me/'+b+'?startapp');try{T.HapticFeedback.impactOccurred('light')}catch(e){}};
$('up').onclick=ask;$('up').hidden=!own;
if(T){draw(J(T.chatData,null)||J(T.publicData,null));T.onEvent('chatDataChanged',()=>draw(J(T.chatData,null)));T.ready&&T.ready();if(own)ask()}
else draw({p:'Олекса',n:'КАЖАНИ',ci:'Полтава',c:['#254e9c','#e4e8ec','#e8b923'],l:3,r:1042,co:420,rec:[5,2,1],k:12,h:[['Гончар','l',71,'Гармата'],['Ткач','e',66,'Маестро'],['Бойко','r',58,'Стіна']]})
</script>
