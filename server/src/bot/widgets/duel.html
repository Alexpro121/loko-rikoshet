<style>
[hidden]{display:none!important}
:root{--h:var(--tg-theme-hint-color);--s:var(--tg-theme-secondary-bg-color)}
body{margin:0;padding:0 0 max(12px,env(safe-area-inset-bottom));font:15px/1.3 system-ui,sans-serif;color:#fff;background:repeating-linear-gradient(90deg,#0f4d34 0 28px,#0b3d2a 28px 56px)}
.tp{padding:12px 14px 0;font:800 13px system-ui,sans-serif;letter-spacing:.14em;color:#ffd34d}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:12px 10px 6px;text-align:center}
.vs svg{display:block;margin:0 auto 6px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.vs b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs span{font-size:12px;color:rgba(255,255,255,.7)}
.x{font:900 28px system-ui,sans-serif;color:#ffd34d;animation:p 1.6s ease-in-out infinite}
@keyframes p{50%{transform:scale(1.18) rotate(-6deg)}}
.cd{display:flex;justify-content:center;gap:6px;padding:8px 0 4px}
.cd i{width:34px;height:42px;display:grid;place-items:center;border-radius:9px;background:#fff;color:#0b3d2a;font:800 22px ui-monospace,monospace;font-style:normal;box-shadow:0 3px 0 #b8c4bd}
.nt{padding:6px 14px 0;text-align:center;font-size:12px;color:rgba(255,255,255,.75)}
.bt{display:flex;gap:8px;padding:12px 12px 0}
button{flex:1;height:44px;border:0;border-radius:12px;background:#ffd34d;color:#0b3d2a;font:800 15px system-ui,sans-serif}
#cp{flex:none;width:auto;padding:0 14px;background:rgba(255,255,255,.16);color:#fff;font-weight:600}
@media (prefers-reduced-motion:reduce){.x{animation:none}}
</style>
<div class="tp">⚔ ВИКЛИК НА МАТЧ</div>
<div class="vs"><div><svg width="46" height="54" viewBox="0 0 40 48"><path id="s0" d="M20 2 38 8v14c0 12-8 20-18 24C10 42 2 34 2 22V8z" fill="#254e9c" stroke="#e8b923" stroke-width="2.5"/><path id="s1" d="M15 4.6h10v39.2l-5 2.2-5-2.2z" fill="#e4e8ec"/></svg><b id="n"></b><span id="r"></span></div>
<div class="x">VS</div>
<div><svg width="46" height="54" viewBox="0 0 40 48"><path d="M20 2 38 8v14c0 12-8 20-18 24C10 42 2 34 2 22V8z" fill="rgba(255,255,255,.12)" stroke="rgba(255,255,255,.5)" stroke-width="2.5" stroke-dasharray="4 3"/><text x="20" y="31" text-anchor="middle" font-size="20" font-weight="800" fill="#fff" font-family="system-ui">?</text></svg><b>Ти?</b><span>будь-який клуб</span></div></div>
<div class="cd" id="cd"></div>
<div class="nt" id="nt"></div>
<div class="bt"><button id="go">Прийняти виклик</button><button id="cp">Код</button></div>
<script>
const T=window.TelegramWidget,$=i=>document.getElementById(i),J=(s,d)=>{try{return s?JSON.parse(s):d}catch(e){return d}};
let D={};
function draw(d){if(!d||typeof d!='object')return;D=d;const c=Array.isArray(d.c)?d.c:[];
 $('s0').setAttribute('fill',c[0]||'#555');$('s1').setAttribute('fill',c[1]||'#999');$('s0').setAttribute('stroke',c[2]||'#ccc');
 $('n').textContent=d.n||d.p||'Гравець';$('r').textContent=(d.p&&d.n?d.p+' · ':'')+(d.r?d.r+' рейтинг':'');
 const code=String(d.code||'').slice(0,5);$('cd').innerHTML='';for(const ch of code){const i=document.createElement('i');i.textContent=ch;$('cd').appendChild(i)}
 $('cd').hidden=!code;$('cp').hidden=!code||!T||T.isPreview;
 $('nt').textContent=code?'Кімната відкрита, поки '+(d.p||'суперник')+' чекає в лобі'+(d.t?' · з '+d.t:''):'Зіграй онлайн-матч у LOKO RUSH'}
$('go').onclick=()=>{if(!T||!D.b)return;T.openTelegramLink('https://t.me/'+D.b+'?startapp'+(D.code?'=room_'+D.code:''));try{T.HapticFeedback.impactOccurred('medium')}catch(e){}};
$('cp').onclick=()=>{if(T&&D.code)T.copyText(D.code)};
if(T){draw(J(T.publicData,null)||J(T.chatData,null));T.onEvent('publicDataChanged',()=>draw(J(T.publicData,null)));T.ready&&T.ready()}
else draw({p:'Олекса',n:'КАЖАНИ',c:['#254e9c','#e4e8ec','#e8b923'],r:1042,code:'K7QXP',t:'19:40',b:'loko_rush_bot'})
</script>
