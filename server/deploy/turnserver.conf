# coturn для онлайн-матчів. Паролі тимчасові: їх видає API гри (/turn) лише гравцям, що увійшли.
listening-port=3478
realm=@DOMAIN@
use-auth-secret
static-auth-secret=@TURN_SECRET@
fingerprint
min-port=@MIN@
max-port=@MAX@
no-cli
no-multicast-peers
no-tlsv1
no-tlsv1_1
# Не пускати трафік у внутрішні мережі сервера
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
# Обмеження, щоб ретранслятор не з'їв канал бота: до 200 сесій і ~1 МБ/с на одну
total-quota=200
bps-capacity=0
max-bps=1000000
log-file=syslog
simple-log
