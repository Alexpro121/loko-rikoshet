# coturn для онлайн-матчів. Паролі тимчасові: їх видає API гри (/turn) лише гравцям, що увійшли.
# Більшість матчів іде напряму між гравцями; через ретранслятор лише ті, кому заважає NAT (≈10–20%).
listening-port=3478
realm=@DOMAIN@
server-name=@DOMAIN@
use-auth-secret
static-auth-secret=@TURN_SECRET@
fingerprint
min-port=@MIN@
max-port=@MAX@
# TLS не потрібен (WebRTC сам шифрує трафік): не слухати 5349 і не шукати сертифікат
no-tls
no-dtls
# WebRTC ретранслює лише UDP
no-tcp-relay
no-cli
no-multicast-peers
no-software-attribute
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780
stale-nonce=600
# Не пускати трафік у внутрішні мережі й на сам сервер (там бот і SSH)
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
@DENY_SELF@
# Обмеження. Матч шле ~64 КБ/с кадрів, тож 160 КБ/с на з'єднання з запасом; разом до ~6 МБ/с (≈50 Мбіт/с)
# і 100 з'єднань, а гравець не більше 4 одночасно. Решта гравців тоді йде через публічний ретранслятор.
total-quota=100
user-quota=4
max-bps=160000
bps-capacity=6000000
log-file=syslog
simple-log
no-stdout-log
